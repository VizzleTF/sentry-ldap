name: Build and Push Sentry LDAP Image

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force rebuild of all versions (ignore .built_versions)"
        required: false
        default: false
        type: boolean

env:
  GHCR_REGISTRY: ghcr.io
  DOCKERHUB_REGISTRY: docker.io
  GHCR_IMAGE: ${{ github.repository }}
  DOCKERHUB_IMAGE: vizzle/sentry-ldap
  MIN_VERSION: "25.9.0"

# Never run two builds at once: both would push tags and race on .built_versions
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    outputs:
      versions_to_build: ${{ steps.get_versions.outputs.versions }}
      latest: ${{ steps.get_versions.outputs.latest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get Sentry releases and filter versions
        id: get_versions
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          set -euo pipefail

          # Published X.Y.Z releases >= MIN_VERSION, oldest first so latest is built last
          gh api "repos/getsentry/self-hosted/releases?per_page=100" \
            --jq '.[] | select((.draft or .prerelease) | not) | .tag_name' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V \
            | while read -r v; do
                if [ "$(printf '%s\n' "$MIN_VERSION" "$v" | sort -V | head -1)" = "$MIN_VERSION" ]; then
                  echo "$v"
                fi
              done > eligible.txt
          LATEST=$(tail -1 eligible.txt)

          if [ "$FORCE_BUILD" = "true" ]; then
            echo "Force build enabled, ignoring .built_versions"
            cp eligible.txt to_build.txt
          else
            grep -vxFf .built_versions eligible.txt > to_build.txt || true
          fi

          VERSIONS_JSON=$(jq -Rnc '[inputs]' < to_build.txt)
          echo "Versions to build (oldest to newest): $VERSIONS_JSON"
          echo "Latest release: $LATEST"
          echo "versions=$VERSIONS_JSON" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

  build:
    needs: check-versions
    if: needs.check-versions.outputs.versions_to_build != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    strategy:
      matrix:
        version: ${{ fromJson(needs.check-versions.outputs.versions_to_build) }}
      max-parallel: 1
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_REGISTRY }}/${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=${{ matrix.version }}
            type=raw,value=latest,enable=${{ matrix.version == needs.check-versions.outputs.latest }}

      # No build cache: each version has its own base image, so a cache never hits
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SENTRY_VERSION=${{ matrix.version }}
          sbom: true

      # Signed provenance, verifiable with `gh attestation verify oci://<image>@<digest> -R <repo>`
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}

      - name: Mark version as built
        env:
          VERSION: ${{ matrix.version }}
        run: |
          mkdir -p built && touch "built/$VERSION"
          {
            echo "## Build Summary"
            echo "- **Sentry Version:** $VERSION"
            echo "- **GHCR Image:** $GHCR_REGISTRY/$GHCR_IMAGE:$VERSION"
            echo "- **Docker Hub Image:** $DOCKERHUB_REGISTRY/$DOCKERHUB_IMAGE:$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload built marker
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built-${{ matrix.version }}
          path: built/
          retention-days: 1

  # Records every version that built, even if other versions in the matrix failed
  update-built-versions:
    needs: [check-versions, build]
    if: always() && needs.check-versions.result == 'success' && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download built markers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: built-*
          path: built
          merge-multiple: true

      - name: Update built versions file
        run: |
          set -euo pipefail
          shopt -s nullglob
          for path in built/*; do
            version=${path#built/}
            grep -qxF "$version" .built_versions || echo "$version" >> .built_versions
          done
          sort -V .built_versions -o .built_versions

      - name: Commit and push
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .built_versions
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Record built versions: $(find built -type f -printf '%f\n' | sort -V | xargs)"
          # main may have moved during a long build
          for _ in 1 2 3; do
            git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && exit 0
            sleep 5
          done
          exit 1

  notify-failure:
    needs: [check-versions, build, update-built-versions]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Image build is failing"
          NUMBER=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "Run failed: $RUN_URL. Close this issue once the build is fixed."
          fi
